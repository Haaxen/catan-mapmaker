<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102d35" />
  <title>CATAN — Mapmaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="CATAN Mapmaker home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        <span class="brand-name">CATAN<span class="brand-sub">MAPMAKER</span></span>
      </a>
      <div class="topbar-right"><span class="status-dot"></span><span>MAP GENERATOR</span></div>
    </header>

    <main class="workspace">
      <section class="map-stage" aria-label="Generated CATAN island map">
        <div class="island-wrap"><svg id="board" viewBox="0 0 820 700" role="img" aria-label="Randomized CATAN board with 19 resource hexes, number tokens, and six harbors"></svg></div>
        <div class="map-toolbar"><span id="seed-label">4H7K2</span><button id="generate" class="generate-button"><span class="dice">⚄</span><span>Generate new map</span></button></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
